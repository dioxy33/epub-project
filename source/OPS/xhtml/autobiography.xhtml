		<section epub:type="part">
			<h2 class="EB04MainHead" id="boo0000141">A Factless Autobiography</h2>
			<blockquote id="boo0004212">
				<p class="EB17Epigraph" id="boo0000142">
					<em>In these random impressions, and with no desire to be other than random, I indifferently
						narrate my factless autobiography, my lifeless history. These are my Confessions, and if in
						them I say nothing, it’s because I have nothing to say.</em>
				</p>
				<p class="EB18EpigraphSource1" id="boo0000143">–Text 12</p>
			</blockquote>
