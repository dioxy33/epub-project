			<h2 class="EB04MainHead" id="boo0002766"><a id="page_399"/>A Disquiet Anthology</h2>
			<blockquote id="boo0004205">
				<p class="EB17Epigraph" id="boo0002767">Pessoa, in a note on how to organize <em>The Book of
						Disquiet</em> (in the <a href="appendix.xhtml">Appendix</a>), considered publishing some of
					the passages with titles in a separate volume. The titled texts included in this section all
					date from the 1910s and have been ordered alphabetically.</p>
			</blockquote>
